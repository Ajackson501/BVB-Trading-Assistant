<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07111f">
<title>BVB Trading Assistant</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1000px;margin:auto;padding:22px 18px 60px}h1{margin:0;font-size:34px}.sub{color:#9eb1c7;margin:5px 0 18px}
.controls{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}input,button{font-size:16px;border-radius:11px;border:1px solid #29405c;padding:12px 14px;background:#122036;color:#fff}
input{width:110px;text-transform:uppercase}button{background:#2364d8;font-weight:750}button.alt{background:#14243a}
.status{background:#0e1a2a;border:1px solid #29405c;border-radius:11px;padding:11px;margin-bottom:13px;color:#c5d2df}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.card{background:#101c2d;border:1px solid #263a53;border-radius:15px;padding:15px}.full{grid-column:1/-1}
.label{font-size:11px;color:#9eb1c7;text-transform:uppercase;letter-spacing:.08em}.value{font-size:26px;font-weight:800;margin-top:5px}.pos{color:#42d99b}.neg{color:#ff7070}.warn{color:#ffd166}
canvas{width:100%;height:320px;display:block;background:#091525;border-radius:11px}.patterns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pattern{background:#091727;border:1px solid #263a53;border-radius:10px;padding:11px;text-align:center}.pattern b{display:block;font-size:21px;margin-top:4px}
ul{padding-left:20px;margin-bottom:0}li{margin:7px 0}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:1}.patterns{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<h1>BVB Trading Assistant</h1>
<div class="sub">Market Structure Prototype • Version 1</div>
<div class="controls"><input id="ticker" value="AVGO"><button id="analyzeBtn">Analyze</button><button id="sampleBtn" class="alt">New Sample</button></div>
<div id="status" class="status">Preparing market sample…</div>
<div class="grid">
<div class="card"><div class="label">Symbol</div><div id="symbol" class="value">AVGO</div></div>
<div class="card"><div class="label">Price</div><div id="price" class="value">$—</div></div>
<div class="card"><div class="label">Trend</div><div id="trend" class="value">—</div></div>
<div class="card"><div class="label">RSI 14</div><div id="rsi" class="value">—</div></div>
<div class="card"><div class="label">Support</div><div id="support" class="value">—</div></div>
<div class="card"><div class="label">Resistance</div><div id="resistance" class="value">—</div></div>
<div class="card full"><canvas id="chart"></canvas></div>
<div class="card full"><div class="label">Market Structure</div><div class="patterns">
<div class="pattern">Higher Highs<b id="hh">0</b></div><div class="pattern">Higher Lows<b id="hl">0</b></div>
<div class="pattern">Lower Highs<b id="lh">0</b></div><div class="pattern">Lower Lows<b id="ll">0</b></div></div></div>
<div class="card full"><div class="label">Analysis</div><ul id="notes"><li>Preparing analysis…</li></ul></div>
</div></div>
<script>
var prices=[];
function E(x){return document.getElementById(x)}
function last(a){return a[a.length-1]}
function generate(){
 var a=[],p=225+Math.random()*25,d=(Math.random()-.45)*.9;
 for(var i=0;i<100;i++){if(i>0&&i%20===0)d+=(Math.random()-.5)*.9;d*=.97;p+=d+Math.sin(i/7)*.5+(Math.random()-.5)*2.7;if(p<20)p=20;a.push(Math.round(p*100)/100)}return a
}
function rsi(a,n){var g=0,l=0;if(a.length<=n)return 50;for(var i=a.length-n;i<a.length;i++){var d=a[i]-a[i-1];if(d>=0)g+=d;else l-=d}if(l===0)return 100;var q=(g/n)/(l/n);return 100-100/(1+q)}
function piv(a){var H=[],L=[],r=2;for(var i=r;i<a.length-r;i++){var hi=true,lo=true;for(var j=i-r;j<=i+r;j++){if(j===i)continue;if(a[i]<=a[j])hi=false;if(a[i]>=a[j])lo=false}if(hi)H.push({i:i,p:a[i]});if(lo)L.push({i:i,p:a[i]})}return{highs:H,lows:L}}
function counts(p){var c={hh:0,hl:0,lh:0,ll:0};for(var i=1;i<p.highs.length;i++){if(p.highs[i].p>p.highs[i-1].p)c.hh++;else c.lh++}for(i=1;i<p.lows.length;i++){if(p.lows[i].p>p.lows[i-1].p)c.hl++;else c.ll++}return c}
function analyze(){
 try{
  if(!prices.length)prices=generate();
  var s=(E("ticker").value||"AVGO").toUpperCase();E("ticker").value=s;E("symbol").textContent=s;
  var p=piv(prices),c=counts(p),R=rsi(prices,14),bull=c.hh+c.hl,bear=c.lh+c.ll,t="Mixed",cl="warn";
  if(bull>bear*1.2){t="Bullish";cl="pos"}else if(bear>bull*1.2){t="Bearish";cl="neg"}
  var sup=p.lows.length?last(p.lows).p:Math.min.apply(null,prices.slice(-20));
  var res=p.highs.length?last(p.highs).p:Math.max.apply(null,prices.slice(-20));
  E("price").textContent="$"+last(prices).toFixed(2);E("trend").textContent=t;E("trend").className="value "+cl;E("rsi").textContent=R.toFixed(1);
  E("support").textContent="$"+sup.toFixed(2);E("resistance").textContent="$"+res.toFixed(2);
  E("hh").textContent=c.hh;E("hl").textContent=c.hl;E("lh").textContent=c.lh;E("ll").textContent=c.ll;
  var n=[];n.push(t==="Bullish"?"Higher-high / higher-low structure currently dominates.":t==="Bearish"?"Lower-high / lower-low structure currently dominates.":"Price structure is currently mixed.");
  n.push(R>70?"RSI is above 70; upward momentum may be stretched.":R<30?"RSI is below 30; downward momentum may be stretched.":"RSI is currently in a neutral range.");
  n.push("Recent support: $"+sup.toFixed(2)+" • Recent resistance: $"+res.toFixed(2));
  var h="";for(var k=0;k<n.length;k++)h+="<li>"+n[k]+"</li>";E("notes").innerHTML=h;draw(p);E("status").textContent="Analysis complete — sample data mode.";
 }catch(err){E("status").textContent="Error: "+err.message}
}
function draw(p){
 var cv=E("chart"),r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.floor(r.width*dpr);cv.height=Math.floor(r.height*dpr);
 var x=cv.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);var w=r.width,h=r.height,pad=28,min=Math.min.apply(null,prices),max=Math.max.apply(null,prices),range=max-min||1;
 function X(i){return pad+i/(prices.length-1)*(w-pad*2)}function Y(v){return h-pad-(v-min)/range*(h-pad*2)}
 x.clearRect(0,0,w,h);x.strokeStyle="#20354e";x.lineWidth=1;for(var g=0;g<5;g++){var yy=pad+g*(h-pad*2)/4;x.beginPath();x.moveTo(pad,yy);x.lineTo(w-pad,yy);x.stroke()}
 x.strokeStyle="#69a7ff";x.lineWidth=2;x.beginPath();for(var i=0;i<prices.length;i++){if(i===0)x.moveTo(X(i),Y(prices[i]));else x.lineTo(X(i),Y(prices[i]))}x.stroke();
 x.fillStyle="#ff7070";for(i=0;i<p.highs.length;i++){x.beginPath();x.arc(X(p.highs[i].i),Y(p.highs[i].p),4,0,Math.PI*2);x.fill()}
 x.fillStyle="#42d99b";for(i=0;i<p.lows.length;i++){x.beginPath();x.arc(X(p.lows[i].i),Y(p.lows[i].p),4,0,Math.PI*2);x.fill()}
}
function fresh(){prices=generate();analyze()}
E("analyzeBtn").addEventListener("click",analyze);E("sampleBtn").addEventListener("click",fresh);
window.addEventListener("load",function(){prices=generate();analyze()});
window.addEventListener("resize",function(){if(prices.length)draw(piv(prices))});
</script>
</body></html>
